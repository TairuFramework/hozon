appId: dev.hozon.e2e
---
- launchApp:
    clearState: true
- tapOn:
    id: "write"
- extendedWaitUntil:
    visible:
      id: "done"
    timeout: 240000
- assertVisible: "Stores: OK.*"
- assertVisible: "Encryption: OK.*"
- stopApp
- launchApp
- tapOn:
    id: "verify"
- extendedWaitUntil:
    visible:
      id: "done"
    timeout: 240000
- assertVisible: "Stores: OK.*"
- assertVisible: "Encryption: OK.*"
