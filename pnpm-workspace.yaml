packages:
  - packages/*
  - tests/*

allowBuilds:
  '@swc/core': true
  cpu-features: false
  electron: false
  esbuild: false
  protobufjs: false
  ssh2: false

nodeLinker: hoisted

versioning:
  changelog:
    storage: repository
  ignore:
    - e2e-electron
    - e2e-expo
    - e2e-web
    - integration-tests
    - hozon-test-scenarios

catalog:
  '@electron-forge/cli': ^8.0.1
  '@electron-forge/plugin-vite': ^8.0.1
  '@logtape/logtape': ^2.4.2
  '@noble/hashes': ^2.4.0
  '@opentelemetry/api': ^1.10.0
  '@opentelemetry/context-async-hooks': ^3.1.1
  '@opentelemetry/core': ^3.1.1
  '@opentelemetry/sdk-trace': ^3.1.1
  '@playwright/test': 1.65.0
  '@sozai/async': ^0.4.3
  '@sozai/codec': ^0.4.4
  '@sozai/json': ^0.3.0
  '@sozai/lock': ^0.1.2
  '@sozai/log': ^0.4.0
  '@sozai/runtime': ^0.1.0
  '@testcontainers/postgresql': ^12.2.1
  '@types/node': ^26.6.6
  '@types/react': ~19.3.0
  '@types/react-dom': ~19.3.0
  '@vitejs/plugin-react': ^6.3.0
  del-cli: ^8.0.1
  electron: ^45.2.3
  expo: ^58.0.23
  expo-sqlite: ~58.0.15
  expo-status-bar: ^58.0.4
  kysely: ^0.29.8
  kysely-postgres-js: ^5.1.0
  postgres: ^4.1.0
  react: 19.3.0
  react-dom: 19.3.0
  react-native: 0.88.1
  react-native-web: 0.21.3
  sqlocal: ^0.18.0
  testcontainers: ^12.1.0
  typescript: ^6.0.3
  vite: ^8.3.7
  vitest: 5.1.0
  '@kigu/dev': ^0.3.5

catalogMode: prefer

overrides:
  # extract-zip 2.0.1 pulls yauzl 2.10.0, which can let Node exit during extraction.
  yauzl: ^3.4.0

minimumReleaseAgeExclude:
  - '@kigu/*'
  - '@sozai/*'
  - '@expo/cli@57.0.2'
  - '@expo/fingerprint@0.20.1'
  - '@expo/inline-modules@0.1.1'
  - '@expo/local-build-cache-provider@57.0.1'
  - '@expo/metro-config@57.0.2'
  - '@expo/prebuild-config@57.0.2'
  - '@expo/router-server@57.0.1'
  - babel-preset-expo@57.0.1
  - expo-asset@57.0.2
  - expo-constants@57.0.2
  - expo-modules-autolinking@57.0.2
  - expo@57.0.0
  - playwright-core@1.65.0

supportedArchitectures:
  cpu: [ current ]
  os: [ current ]
