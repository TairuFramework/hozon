[workspace]
members = ["crates/hozon-sqlite", "crates/hozon-sqlite-napi"]
resolver = "3"

[workspace.package]
edition = "2024"
license = "MIT"
publish = false

[workspace.dependencies]
rusqlite = { version = "=0.43.0", features = ["bundled"] }
napi = { version = "=3.16.1", default-features = false, features = ["napi4"] }
napi-derive = "=3.7.0"
napi-build = "=2.6.0"
serde_json = { version = "=1.0.154", features = ["float_roundtrip"] }
hozon-sqlite = { path = "crates/hozon-sqlite" }

[profile.release]
lto = "thin"
codegen-units = 1
